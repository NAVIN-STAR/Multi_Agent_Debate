name: Deploy Debate Application

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: "pyproject.toml"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests
        run: uv run pytest -m "not live"


  deploy:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install cloudflared
        run: |
          wget https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x cloudflared-linux-amd64
          sudo mv cloudflared-linux-amd64 /usr/local/bin/cloudflared

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Configure SSH
        run: |
          cat > ~/.ssh/config <<EOF
          Host ssh.nabinlabs.in
            User ${{ secrets.SERVER_USER }}
            IdentityFile ~/.ssh/id_ed25519
            StrictHostKeyChecking no
            ProxyCommand cloudflared access ssh --hostname %h --id ${{ secrets.CF_ACCESS_CLIENT_ID }} --secret ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          EOF

          chmod 600 ~/.ssh/config

      - name: Test SSH connection
        run: |
          ssh ssh.nabinlabs.in "hostname"

      - name: Deploy Application
        run: |
          ssh ssh.nabinlabs.in <<'EOF'
            set -e

            cd /opt/apps/Multi_Agent_Debate

            git pull origin main

            docker compose up -d --build

            docker compose ps
          EOF
      - name: Verify deployment
        run: |
            ssh ssh.nabinlabs.in <<'EOF'
            set -e

            curl --fail http://localhost:8002/docs
            EOF