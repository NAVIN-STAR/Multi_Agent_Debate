name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install cloudflared
        run: |
          curl -L --output cloudflared \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64

          chmod +x cloudflared
          sudo mv cloudflared /usr/local/bin/cloudflared

      - name: Configure SSH key
        run: |
          mkdir -p ~/.ssh

          printf '%s\n' '${{ secrets.SERVER_SSH_KEY }}' \
            > ~/.ssh/id_ed25519

          chmod 600 ~/.ssh/id_ed25519

      - name: Configure SSH
        run: |
          cat > ~/.ssh/config <<EOF
          Host ssh.nabinlabs.in
            User ${{ secrets.SERVER_USER }}
            IdentityFile ~/.ssh/id_ed25519
            StrictHostKeyChecking no
            ProxyCommand cloudflared access ssh \
              --hostname %h \
              --id ${{ secrets.CF_ACCESS_CLIENT_ID }} \
              --secret ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          EOF

          chmod 600 ~/.ssh/config

      - name: Test SSH connection
        run: |
          ssh ssh.nabinlabs.in "hostname"